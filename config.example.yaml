# Konfiguracja screenshot-ftp. Skopiuj do config.yaml i uzupełnij.
# Komentarze (linie z #) są dozwolone — ale UWAGA: zapis przez okno
# "Ustawienia…" w aplikacji nadpisuje plik i usuwa komentarze.

watch_dir: "~/Desktop"                 # folder obserwowany (macOS zapisuje zrzuty na Pulpit)
extensions: [".png", ".jpg", ".jpeg", ".gif", ".webp", ".heic", ".tiff", ".bmp"]
filename_prefixes: []                  # np. ["Screenshot", "Zrzut ekranu"]; puste = każdy obraz
poll_interval_seconds: 1.0
stable_checks: 2                       # ile odczytów stałego rozmiaru zanim wyślemy plik

ftp:
  host: "ftp.example.com"
  port: 21
  user: "login"
  use_keychain: true                   # hasło z Keychain (zalecane); ustaw je w menu "Ustaw hasło FTP…"
  # password: "haslo"                   # alternatywa (odradzane) — działa tylko gdy use_keychain: false
  remote_dir: "/public_html/screens"   # katalog docelowy (tworzony, jeśli nie istnieje)
  passive: true
  use_tls: false                       # true = FTPS (FTP over TLS)

public_base_url: "https://example.com/screens"   # publiczny URL odpowiadający remote_dir (bez końcowego /)
copy_url_to_clipboard: true
open_in_browser: true
rename_pattern: "shot-{timestamp}{ext}"          # zmienne: {timestamp} {ext} {name} {original}
delete_local_after_upload: false
log_file: "~/Library/Logs/screenshot-ftp.log"
